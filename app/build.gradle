plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 签名：本地放了 keystore.jks 就用它；没有则退回 debug 签名，
// 这样 clone 下来的人 / CI 不带私钥也能直接构建。
// 口令可用环境变量（KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）
// 或 gradle.properties（keystorePassword / keyAlias）覆盖。
// ---------------------------------------------------------------------------
def keystoreFile = rootProject.file('keystore.jks')
def hasKeystore = keystoreFile.exists()
def storePass = System.getenv('KEYSTORE_PASSWORD') ?: (project.findProperty('keystorePassword') ?: 'gcodesender')
def keyAliasName = System.getenv('KEY_ALIAS') ?: (project.findProperty('keyAlias') ?: 'gcodesender')
def keyPass = System.getenv('KEY_PASSWORD') ?: storePass

// 版本号：可用环境变量 VERSION_CODE / VERSION_NAME 或 gradle.properties 覆盖
def vCode = (System.getenv('VERSION_CODE') ?: (project.findProperty('versionCode') ?: '1')).toString().toInteger()
def vName = (System.getenv('VERSION_NAME') ?: (project.findProperty('versionName') ?: '1.0')).toString()

android {
    namespace 'com.dsh.gcodesender'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.gcodesender"
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName vName
        vectorDrawables.useSupportLibrary false
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile keystoreFile
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../third_party/usbSerialJava']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'
}
